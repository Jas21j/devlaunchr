name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: Typecheck and tests
    # The suite spawns real servers and inspects real processes, so it runs on
    # every platform the app ships to rather than only on Linux.
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Generate brand assets
        run: npm run prebuild

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npx electron-vite build

      # Each suite is its own step, and every step runs even when an earlier
      # one failed, so one broken suite never hides the state of the others.
      # Electron needs a display server to create a BrowserWindow; on Linux
      # that is xvfb.
      - name: Test store
        if: ${{ !cancelled() }}
        shell: bash
        run: ${{ runner.os == 'Linux' && 'xvfb-run --auto-servernum' || '' }} npm run smoke:store

      - name: Test runtime
        if: ${{ !cancelled() }}
        shell: bash
        run: ${{ runner.os == 'Linux' && 'xvfb-run --auto-servernum' || '' }} npm run smoke:runtime

      - name: Test ports
        if: ${{ !cancelled() }}
        shell: bash
        run: ${{ runner.os == 'Linux' && 'xvfb-run --auto-servernum' || '' }} npm run smoke:ports

      - name: Test thumbnails
        if: ${{ !cancelled() }}
        shell: bash
        run: ${{ runner.os == 'Linux' && 'xvfb-run --auto-servernum' || '' }} npm run smoke:thumbs
